<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Wedding of Angelo and Angela</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Great+Vibes&amp;family=Parisienne&amp;family=Playfair+Display:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blush: #8eaf92;
        --wine: #b1b26a;
        --peach: #efb8a9;
        --teal: #db4453;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: calc(100 * min(var(--vh, 1vh), 1vh));
        color: var(--wine);
        font-family: "DM Sans", sans-serif;
        background: linear-gradient(
          145deg,
          #f4c984 0%,
          #f7ede4 52%,
          #ecd7d0 100%
        );
      }
      .app-shell {
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        position: relative;
        background: linear-gradient(
          145deg,
          #f4c984 0%,
          #f7ede4 52%,
          #ecd7d0 100%
        );
      }
      .page-floral-background {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        min-width: 100%;
        max-width: none;
        height: 100%;
        min-height: 100%;
        object-fit: cover;
        object-position: center;
        filter: none;
        opacity: 0.28;
        transform: scale(1.06);
        background: #ecd7d0;
        transition:
          transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.45s ease,
          z-index 0s linear 0.45s;
      }
      .page-floral-background:hover,
      .page-floral-background:focus-visible {
        z-index: 3;
        transform: scale(1.12);
        opacity: 0.36;
        transition-delay: 0s;
      }
      .page-floral-background:focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: -6px;
      }
      .app-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background: radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(72, 20, 28, 0.18) 100%
        );
      }
      .app-shell > main {
        position: relative;
        z-index: 2;
      }
      .app-shell > .page-floral-background {
        z-index: 0;
      }
      .view {
        display: none;
        position: relative;
        width: 100%;
        min-height: calc(100 * min(var(--vh, 1vh), 1vh));
        padding: 42px 24px;
      }
      .view.active {
        display: flex;
        animation: appear 0.48s ease both;
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .serif {
        font-family: "Playfair Display", serif;
      }
      .eyebrow {
        font:
          600 11px "DM Sans",
          sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      .ornament {
        display: block;
        margin-inline: auto;
        width: 96px;
        height: 32px;
        color: var(--teal);
      }
      .landing-inner {
        width: 100%;
        max-width: 800px;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .landing-title {
        max-width: 760px;
        line-height: 1.08;
        margin: 18px 0 26px;
        font-family: "Great Vibes", "Parisienne", cursive;
        font-weight: 400;
        letter-spacing: 0.015em;
        text-wrap: balance;
        text-shadow:
          0 2px 0 rgba(236, 215, 208, 0.8),
          0 5px 12px rgba(137, 0, 37, 0.12);
      }
      .envelope-scene {
        position: relative;
        width: min(420px, 85vw);
        aspect-ratio: 1.44;
        margin: 4px auto 35px;
        filter: drop-shadow(0 18px 18px rgba(137, 0, 37, 0.14));
        cursor: pointer;
        transition:
          transform 0.45s ease,
          filter 0.45s ease;
        outline: none;
      }
      .envelope-scene:hover,
      .envelope-scene:focus-visible {
        transform: translateY(-8px) rotate(-1.2deg);
        filter: drop-shadow(0 27px 24px rgba(137, 0, 37, 0.22));
      }
      .envelope {
        position: absolute;
        inset: 9% 0 0;
        background-color: var(--peach);
        background-image:
          radial-gradient(rgba(236, 215, 208, 0.22) 0.7px, transparent 0.9px),
          radial-gradient(rgba(137, 0, 37, 0.1) 0.55px, transparent 0.8px),
          linear-gradient(
            145deg,
            rgba(236, 215, 208, 0.28),
            transparent 44%,
            rgba(137, 0, 37, 0.12)
          );
        background-size:
          5px 5px,
          7px 7px,
          100% 100%;
        border: 0;
        border-radius: 5px;
        overflow: hidden;
        box-shadow:
          inset 0 1px 0 rgba(236, 215, 208, 0.8),
          inset 0 -7px 12px rgba(137, 0, 37, 0.14),
          0 15px 18px rgba(137, 0, 37, 0.12);
      }
      .envelope::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            135deg,
            rgba(236, 215, 208, 0.45),
            transparent 32%,
            rgba(137, 0, 37, 0.08)
          ),
          linear-gradient(
            90deg,
            transparent 49%,
            rgba(137, 0, 37, 0.16) 50%,
            transparent 51%
          );
        clip-path: polygon(0 0, 100% 0, 50% 58%);
        z-index: 2;
        filter: drop-shadow(0 3px 2px rgba(137, 0, 37, 0.35));
        transform-origin: top;
        transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .envelope::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            150deg,
            transparent 38%,
            rgba(236, 215, 208, 0.4) 39%,
            transparent 40%
          ),
          linear-gradient(
            30deg,
            transparent 38%,
            rgba(137, 0, 37, 0.18) 39%,
            transparent 40%
          );
        clip-path: polygon(0 100%, 50% 38%, 100% 100%);
        z-index: 3;
      }
      .fold-left,
      .fold-right {
        position: absolute;
        inset: 0;
        background: linear-gradient(125deg, var(--blush), #d79c80);
        z-index: 1;
      }
      .fold-left {
        clip-path: polygon(0 0, 53% 55%, 0 100%);
        box-shadow: inset -2px 0 rgba(137, 0, 37, 0.18);
      }
      .fold-right {
        clip-path: polygon(100% 0, 47% 55%, 100% 100%);
        box-shadow: inset 2px 0 rgba(137, 0, 37, 0.18);
      }
      .invitation-card {
        position: absolute;
        z-index: 0;
        left: 8%;
        right: 8%;
        top: 9%;
        height: 76%;
        border: 2px solid var(--wine);
        background-color: #f7ede4;
        background-image:
          radial-gradient(rgba(137, 0, 37, 0.08) 0.7px, transparent 0.8px),
          radial-gradient(
            circle at 50% 50%,
            transparent 0 31%,
            rgba(82, 135, 128, 0.12) 31.5% 32%,
            transparent 32.5%
          ),
          linear-gradient(
            45deg,
            transparent 47%,
            rgba(215, 156, 128, 0.18) 48% 52%,
            transparent 53%
          ),
          linear-gradient(
            -45deg,
            transparent 47%,
            rgba(215, 156, 128, 0.18) 48% 52%,
            transparent 53%
          );
        background-size:
          5px 5px,
          100% 100%,
          34px 34px,
          34px 34px;
        box-shadow:
          inset 0 0 0 5px #f7ede4,
          inset 0 0 0 7px var(--wine),
          inset 0 0 0 10px var(--peach),
          inset 0 0 0 13px var(--wine),
          0 3px 10px rgba(137, 0, 37, 0.2);
        transform: translateY(0);
        transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 19%;
      }
      .invitation-message {
        margin: 0;
        color: #db4453;
        font:
          700 clamp(24px, 5.8vw, 39px)/1.05 "Parisienne",
          cursive;
        letter-spacing: 0.055em;
        white-space: nowrap;
        text-align: center;
        text-shadow:
          1px 1px 0 #d79c80,
          -1px -1px 0 #d79c80,
          0 2px 5px rgba(137, 0, 37, 0.18);
      }
      .invitation-flourish {
        width: 92px;
        height: 22px;
        margin-top: 10px;
        color: var(--peach);
        filter: drop-shadow(0 1px 0 var(--wine));
      }
      .invitation-card::before,
      .invitation-card::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background:
          radial-gradient(
            circle at 50% 15%,
            var(--wine) 0 2px,
            transparent 2.5px
          ),
          radial-gradient(
            circle at 85% 50%,
            var(--wine) 0 2px,
            transparent 2.5px
          ),
          radial-gradient(
            circle at 50% 85%,
            var(--wine) 0 2px,
            transparent 2.5px
          ),
          radial-gradient(
            circle at 15% 50%,
            var(--wine) 0 2px,
            transparent 2.5px
          ),
          radial-gradient(circle, var(--peach) 0 3px, transparent 3.5px);
      }
      .invitation-card::before {
        top: 12px;
        left: 12px;
      }
      .invitation-card::after {
        right: 12px;
        bottom: 12px;
        transform: rotate(45deg);
      }
      .envelope-scene.opening {
        animation: envelopeFade 0.32s ease 720ms forwards;
      }
      .envelope-scene.opening .envelope::before {
        transform: rotateX(180deg);
      }
      .envelope-scene.opening .invitation-card {
        transform: translateY(-112%);
      }
      @keyframes envelopeFade {
        to {
          opacity: 0;
        }
      }
      .seal {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 58%;
        transform: translate(-50%, -50%) rotate(-3deg);
        width: 88px;
        height: 88px;
        border-radius: 46% 54% 49% 51% / 52% 45% 55% 48%;
        background-color: var(--wine);
        background-image:
          radial-gradient(
            circle at 35% 25%,
            rgba(236, 215, 208, 0.26),
            transparent 18%
          ),
          radial-gradient(
            ellipse at 72% 23%,
            rgba(236, 215, 208, 0.14),
            transparent 20%
          ),
          radial-gradient(
            ellipse at 24% 76%,
            rgba(65, 0, 16, 0.24),
            transparent 25%
          ),
          radial-gradient(
            circle at 68% 75%,
            rgba(137, 0, 37, 0.72),
            transparent 48%
          );
        border: 5px double var(--peach);
        box-shadow:
          inset 3px 3px 5px rgba(236, 215, 208, 0.3),
          inset -5px -6px 7px rgba(65, 0, 16, 0.42),
          0 5px 12px rgba(137, 0, 37, 0.3);
        display: grid;
        place-items: center;
        transition:
          opacity 0.3s,
          transform 0.5s;
      }
      .seal::before {
        content: "";
        position: absolute;
        inset: 7px;
        border-radius: 53% 47% 48% 52%;
        border: 1px solid rgba(236, 215, 208, 0.35);
      }
      .seal span {
        color: var(--blush);
        text-shadow:
          1px 1px 1px rgba(65, 0, 16, 0.6),
          -1px -1px 1px rgba(236, 215, 208, 0.25);
        font:
          500 23px "Playfair Display",
          serif;
        white-space: nowrap;
      }
      .envelope-scene.opening .seal {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }
      .primary-button {
        border: 1px solid var(--wine);
        border-radius: 100px;
        padding: 15px 35px;
        background: var(--wine);
        color: var(--blush);
        font:
          600 12px "DM Sans",
          sans-serif;
        letter-spacing: 0.19em;
        text-transform: uppercase;
        transition:
          transform 0.2s,
          background 0.2s,
          color 0.2s;
        cursor: pointer;
      }
      .primary-button:hover {
        transform: translateY(-3px);
        background: var(--teal);
        border-color: var(--teal);
      }
      button:focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 5px;
      }
      h1:focus,
      h2:focus {
        outline: none;
      }
      .menu-inner {
        width: 100%;
        max-width: 1120px;
        margin: auto;
        text-align: center;
        display: flex;
        flex-direction: column;
      }
      .menu-names {
        margin: 14px 0 4px;
        font-weight: 500;
        line-height: 1.2;
      }
      .menu-subtitle {
        margin: 0 0 4px;
        color: var(--wine);
        font:
          400 13px/1.5 "Playfair Display",
          serif;
        letter-spacing: 0.035em;
      }
      .wedding-date {
        margin: 0 0 8px;
        color: var(--wine);
        font:
          500 25px/1.25 "Parisienne",
          cursive;
        letter-spacing: 0.045em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .wedding-date::before,
      .wedding-date::after {
        content: "❧";
        display: inline-block;
        color: var(--teal);
        font:
          400 20px/1 "Parisienne",
          cursive;
        letter-spacing: 0;
        transform: scaleX(1.35);
      }
      .wedding-date::before {
        transform: scaleX(-1.35);
      }
      .menu-rule {
        width: 80px;
        height: 1px;
        background: var(--wine);
        margin: 22px auto 30px;
      }
      /* Swap the menu cards into the Polaroids' original position. */
      .photo-collage {
        order: 2;
        position: relative;
        width: min(100%, 1040px);
        height: 350px;
        /* Creates a clear gap after the menu cards. */
        margin: 34px auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
      }
      .collage-photo {
        position: absolute;
        left: 50%;
        top: 8px;
        width: clamp(210px, 27vw, 300px);
        height: auto;
        padding: 14px 14px 44px;
        border: 1px solid rgba(120, 100, 88, 0.2);
        border-radius: 2px;
        background: #fff;
        box-shadow:
          0 14px 24px rgba(72, 20, 28, 0.2),
          inset 0 0 10px rgba(210, 190, 175, 0.18);
        transform-origin: center;
        transition:
          transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.35s ease;
      }
      .collage-photo:hover,
      .collage-photo:focus-within {
        z-index: 20;
        box-shadow:
          0 24px 34px rgba(72, 20, 28, 0.3),
          inset 0 0 10px rgba(210, 190, 175, 0.18);
      }
      .collage-photo::after {
        content: "";
        position: absolute;
        inset: 8px 8px 25px;
        pointer-events: none;
        border-radius: 1px;
        background:
          radial-gradient(rgba(137, 0, 37, 0.08) 0.5px, transparent 0.8px),
          linear-gradient(
            115deg,
            rgba(255, 255, 255, 0.35),
            transparent 45%,
            rgba(190, 170, 155, 0.12)
          );
        background-size:
          5px 5px,
          100% 100%;
        mix-blend-mode: multiply;
        opacity: 0.55;
      }
      .collage-photo img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 5px;
      }
      /* Three centered Polaroids, with the outer photos exchanged. */
      .collage-photo-two {
        transform: translateX(-82%) rotate(-7deg);
        z-index: 1;
      }
      .collage-photo-three {
        transform: translateX(-50%) rotate(2deg);
        z-index: 3;
      }
      .collage-photo-four {
        transform: translateX(-18%) rotate(7deg);
        z-index: 2;
      }
      .collage-photo-two:hover,
      .collage-photo-two:focus-within {
        transform: translateX(-82%) translateY(-8px) scale(1.08) rotate(-2deg);
      }
      .collage-photo-three:hover,
      .collage-photo-three:focus-within {
        transform: translateX(-50%) translateY(-8px) scale(1.08) rotate(0deg);
      }
      .collage-photo-four:hover,
      .collage-photo-four:focus-within {
        transform: translateX(-18%) translateY(-8px) scale(1.08) rotate(2deg);
      }
      .tile-grid {
        order: 1;
        position: relative;
        display: flex;
        width: min(100%, 760px);
        min-height: 230px;
        margin: 0 auto;
        align-items: flex-end;
        justify-content: center;
      }
      .menu-tile {
        position: relative;
        z-index: 1;
        width: clamp(155px, 22vw, 215px);
        min-height: 183px;
        margin: 0 -28px;
        border: 1px solid rgba(137, 0, 37, 0.35);
        background: #ecd7d0 !important;
        border-radius: 8px;
        padding: 22px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        cursor: pointer;
        transform-origin: 50% 100%;
        transition:
          transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.35s ease,
          filter 0.35s ease;
        overflow: hidden;
        box-shadow:
          0 14px 22px rgba(72, 20, 28, 0.16),
          inset 0 0 18px rgba(255, 255, 255, 0.18),
          inset 0 -12px 18px rgba(137, 0, 37, 0.08);
      }
      .menu-tile:nth-child(1) {
        border: 1px solid rgba(137, 0, 37, 0.42);
        border-style: solid;
      }
      .menu-tile:nth-child(2) {
        border: 1px solid rgba(82, 135, 128, 0.55);
        border-style: dashed;
      }
      .menu-tile:nth-child(3) {
        border: 1px solid rgba(215, 156, 128, 0.8);
        border-style: double;
        border-width: 3px;
      }
      .menu-tile:nth-child(4) {
        border: 1px solid rgba(137, 0, 37, 0.34);
        border-style: dotted;
      }
      .menu-tile::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.42;
        background-image:
          radial-gradient(rgba(137, 0, 37, 0.18) 0.55px, transparent 0.8px),
          radial-gradient(rgba(255, 255, 255, 0.35) 0.65px, transparent 0.9px),
          linear-gradient(
            105deg,
            transparent 0 47%,
            rgba(137, 0, 37, 0.08) 49%,
            transparent 51%
          );
        background-size:
          6px 6px,
          9px 9px,
          100% 100%;
        mix-blend-mode: multiply;
      }
      .menu-tile > * {
        position: relative;
        z-index: 1;
      }
      .menu-tile:nth-child(1) {
        transform: rotate(-14deg) translateY(17px);
        z-index: 1;
      }
      .menu-tile:nth-child(2) {
        transform: rotate(-5deg) translateY(4px);
        z-index: 2;
      }
      .menu-tile:nth-child(3) {
        transform: rotate(5deg) translateY(4px);
        z-index: 2;
      }
      .menu-tile:nth-child(4) {
        transform: rotate(14deg) translateY(17px);
        z-index: 1;
      }
      .menu-tile:hover,
      .menu-tile:focus-visible {
        z-index: 10;
        transform: rotate(0deg) translateY(-18px) scale(1.06);
        box-shadow:
          0 25px 34px rgba(72, 20, 28, 0.28),
          inset 0 0 18px rgba(255, 255, 255, 0.25),
          inset 0 -12px 18px rgba(137, 0, 37, 0.08);
        filter: saturate(1.08);
      }
      .menu-tile:focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 6px;
      }
      .tile-art {
        width: 82px;
        height: 75px;
        color: var(--teal);
      }
      .tile-art .accent {
        stroke: var(--wine);
      }
      .tile-label {
        font:
          500 20px "Playfair Display",
          serif;
        color: var(--wine);
      }
      .destination {
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .destination-inner {
        width: 100%;
        max-width: 680px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .destination h2 {
        margin: 22px 0 34px;
        font-weight: 500;
      }
      .back-button {
        border: 1px solid var(--wine);
        border-radius: 100px;
        background: transparent;
        color: var(--wine);
        padding: 13px 27px;
        font:
          600 12px "DM Sans",
          sans-serif;
        letter-spacing: 0.12em;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .back-button:hover {
        background: var(--wine);
        color: var(--blush);
      }
      .music-control {
        position: relative;
        right: auto;
        bottom: auto;
        z-index: 5;
        margin: 8px auto 0;
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(137, 0, 37, 0.55);
        border-radius: 50%;
        background: rgba(247, 237, 228, 0.9);
        color: var(--wine);
        box-shadow: 0 8px 18px rgba(137, 0, 37, 0.14);
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.2s,
          color 0.2s;
      }
      .music-control:hover {
        transform: translateY(-2px);
        background: var(--wine);
        color: var(--blush);
      }
      .music-control svg {
        width: 19px;
        height: 19px;
      }
      /* Tablet and mobile layouts */
      @media (max-width: 700px) {
        .view {
          padding: 30px 16px;
        }

        .menu-inner {
          max-width: 560px;
        }

        .menu-names {
          max-width: 100%;
          overflow-wrap: anywhere;
        }

        .menu-inner > .menu-names:first-of-type {
          font-size: clamp(25px, 5.5vw, 36px) !important;
          line-height: 1.2;
        }

        .menu-inner > .menu-names:nth-of-type(2) {
          font-size: clamp(27px, 6vw, 40px) !important;
          line-height: 1.15;
        }

        .wedding-date {

        .photo-collage {

        }

          top: 5px;
          width: clamp(112px, 28vw, 185px);
          height: auto;
          padding: 9px 9px 31px;
        }

        .collage-photo::after {
          inset: 9px 9px 30px;
        }

        .collage-photo-two {
          transform: translateX(-82%) rotate(-7deg);
        }

        .collage-photo-three {
          transform: translateX(-50%) rotate(2deg);
        }

        .collage-photo-four {
          transform: translateX(-18%) rotate(7deg);
        }

        .collage-photo-two:hover,
        .collage-photo-two:focus-within {
          transform: translateX(-82%) translateY(-5px) scale(1.03) rotate(-2deg);
        }

        .collage-photo-three:hover,
        .collage-photo-three:focus-within {
          transform: translateX(-50%) translateY(-5px) scale(1.03) rotate(0deg);
        }

        .collage-photo-four:hover,
        .collage-photo-four:focus-within {
          transform: translateX(-18%) translateY(-5px) scale(1.03) rotate(2deg);
        }

        /* A 2-by-2 grid avoids squeezing four cards on narrow screens. */
        .tile-grid {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
          width: 100%;
          min-height: 0;
          margin: 12px auto 0;
          align-items: stretch;
        }

        .menu-tile,
        .menu-tile:nth-child(1),
        .menu-tile:nth-child(2),
        .menu-tile:nth-child(3),
        .menu-tile:nth-child(4) {
          width: 100%;
          min-width: 0;
          min-height: 145px;
          margin: 0;
          padding: 15px 8px;
          transform: none;
          gap: 9px;
        }

          transform: translateY(-3px) scale(1.02);
        }

        .tile-art {
          width: clamp(42px, 10vw, 58px);

        }

    <script>
      const views = Array.from(document.querySelectorAll(".view"));
      const musicControl = document.getElementById("music-control");
      const pauseIcon = document.getElementById("music-icon-pause");
      const playIcon = document.getElementById("music-icon-play");
      const backgroundMusic = document.getElementById("background-music");
      let musicPlaying = false;

      function updateMusicButton(isPlaying) {
        musicPlaying = isPlaying;
        musicControl.setAttribute(
          "aria-label",
          isPlaying ? "Pause background music" : "Play background music",
        );
        musicControl.setAttribute("aria-pressed", String(!isPlaying));
        pauseIcon.style.display = isPlaying ? "block" : "none";
        playIcon.style.display = isPlaying ? "none" : "block";
      }

      async function startMusic() {
        if (musicPlaying) return;
        try {
          await backgroundMusic.play();
          updateMusicButton(true);
        } catch (error) {
          // Browsers may block playback until the visitor taps the music button.
          updateMusicButton(false);
        }
      }

      function stopMusic() {
        backgroundMusic.pause();
        updateMusicButton(false);
      }

      backgroundMusic.addEventListener("ended", () => updateMusicButton(false));
      backgroundMusic.addEventListener("pause", () => {
        if (!backgroundMusic.ended) updateMusicButton(false);
      });
      backgroundMusic.addEventListener("play", () => updateMusicButton(true));

      musicControl.addEventListener("click", () =>
        backgroundMusic.paused ? startMusic() : stopMusic(),
      );
      function showView(id) {
        const next = document.getElementById(id);
        if (!next || !next.classList.contains("view")) return;
        views.forEach((view) => view.classList.toggle("active", view === next));
        if (id === "menu") startMusic();
        const focusTarget =
          next.querySelector('[tabindex="-1"]') || next.querySelector("button");
        if (focusTarget) focusTarget.focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: "auto" });
      }
      const envelopeScene = document.getElementById("envelope-scene");
      let opening = false;
      function openInvitation() {
        if (opening) return;
        opening = true;
        envelopeScene.classList.add("opening");
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        setTimeout(() => showView("menu"), reducedMotion ? 40 : 1060);
      }
      envelopeScene.addEventListener("click", openInvitation);
      document
        .getElementById("open-invitation-button")
        .addEventListener("click", openInvitation);
      envelopeScene.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openInvitation();
        }
      });
      document.querySelectorAll("[data-go]").forEach((button) => {
        button.addEventListener("click", () => showView(button.dataset.go));
      });
    </script>
