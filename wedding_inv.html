    <script>
      const views = Array.from(document.querySelectorAll(".view"));
      const musicControl = document.getElementById("music-control");
      const pauseIcon = document.getElementById("music-icon-pause");
      const playIcon = document.getElementById("music-icon-play");
      let musicContext = null;
      let musicTimer = null;
      let musicPlaying = false;
      function startMusic() {
        if (musicPlaying) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!musicContext) musicContext = new AudioContext();
        if (musicContext.state === "suspended") musicContext.resume();
        const progression = [
          [329.63, 415.3, 493.88, 622.25],
          [277.18, 349.23, 415.3, 554.37],
          [311.13, 392.0, 466.16, 622.25],
          [246.94, 311.13, 369.99, 493.88],
        ];
        const guitarPattern = [0, 2, 1, 3, 1, 2, 0, 1];
        const pianoPattern = [0, 1, 2, 3, 2, 1, 0, 2, 1, 3, 2, 0, 1, 2, 3, 1];
        let step = 0;
        const playNote = () => {
          if (!musicPlaying) return;
          const now = musicContext.currentTime;
          const bar = Math.floor(step / 8);
          const beat = step % 8;
          const chord = progression[bar % progression.length];
          const piano = musicContext.createOscillator();
          const pianoGain = musicContext.createGain();
          piano.type = "sine";
          piano.frequency.value =
            chord[pianoPattern[step % pianoPattern.length]] * 2;
          pianoGain.gain.setValueAtTime(0.0001, now);
          pianoGain.gain.exponentialRampToValueAtTime(0.048, now + 0.035);
          pianoGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);
          piano.connect(pianoGain).connect(musicContext.destination);
          piano.start(now);
          piano.stop(now + 0.5);
          const guitar = musicContext.createOscillator();
          const guitarGain = musicContext.createGain();
          guitar.type = "triangle";
          guitar.frequency.value = chord[guitarPattern[beat]] * 2;
          guitarGain.gain.setValueAtTime(0.0001, now);
          guitarGain.gain.exponentialRampToValueAtTime(0.018, now + 0.025);
          guitarGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
          guitar.connect(guitarGain).connect(musicContext.destination);
          guitar.start(now);
          guitar.stop(now + 0.24);
          if (beat === 0 || beat === 4) {
            const bass = musicContext.createOscillator();
            const bassGain = musicContext.createGain();
            bass.type = "triangle";
            bass.frequency.value = chord[0] / 2;
            bassGain.gain.setValueAtTime(0.0001, now);
            bassGain.gain.exponentialRampToValueAtTime(0.04, now + 0.025);
            bassGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
            bass.connect(bassGain).connect(musicContext.destination);
            bass.start(now);
            bass.stop(now + 0.65);
          }
          if (beat % 2 === 0) {
            chord.slice(1, 4).forEach((note, index) => {
              const string = musicContext.createOscillator();
              const stringGain = musicContext.createGain();
              string.type = "sine";
              string.frequency.value = note * (index + 2);
              stringGain.gain.setValueAtTime(0.0001, now);
              stringGain.gain.exponentialRampToValueAtTime(0.005, now + 0.18);
              stringGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
              string.connect(stringGain).connect(musicContext.destination);
              string.start(now);
              string.stop(now + 0.9);
            });
          }
          const percussion = musicContext.createBufferSource();
          const percussionGain = musicContext.createGain();
          const buffer = musicContext.createBuffer(
            1,
            musicContext.sampleRate * 0.08,
            musicContext.sampleRate,
          );
          const noise = buffer.getChannelData(0);
          for (let i = 0; i < noise.length; i++)
            noise[i] = (Math.random() * 2 - 1) * (1 - i / noise.length);
          percussion.buffer = buffer;
          percussionGain.gain.setValueAtTime(
            beat === 0 || beat === 4 ? 0.026 : 0.012,
            now,
          );
          percussionGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
          percussion.connect(percussionGain).connect(musicContext.destination);
          percussion.start(now);
          step++;
        };
        musicPlaying = true;
        playNote();
        musicTimer = window.setInterval(playNote, 420);
        musicControl.setAttribute("aria-label", "Pause background music");
        musicControl.setAttribute("aria-pressed", "false");
        pauseIcon.style.display = "block";
        playIcon.style.display = "none";
      }
      function stopMusic() {
        musicPlaying = false;
        window.clearInterval(musicTimer);
        musicTimer = null;
        musicControl.setAttribute("aria-label", "Play background music");
        musicControl.setAttribute("aria-pressed", "true");
        pauseIcon.style.display = "none";
        playIcon.style.display = "block";
      }
      musicControl.addEventListener("click", () =>
        musicPlaying ? stopMusic() : startMusic(),
      );
      function showView(id) {
        const next = document.getElementById(id);
        if (!next || !next.classList.contains("view")) return;
        views.forEach((view) => view.classList.toggle("active", view === next));
        if (id === "menu") startMusic();
        const focusTarget =
          next.querySelector('[tabindex="-1"]') || next.querySelector("button");
        if (focusTarget) focusTarget.focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      const envelopeScene = document.getElementById("envelope-scene");
      let opening = false;
      function openInvitation() {
        if (opening) return;
        opening = true;
        envelopeScene.classList.add("opening");
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        setTimeout(() => showView("menu"), reducedMotion ? 40 : 1060);
      }
      envelopeScene.addEventListener("click", openInvitation);
      document
        .getElementById("open-invitation-button")
        .addEventListener("click", openInvitation);
      envelopeScene.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openInvitation();
        }
      });
      document.querySelectorAll("[data-go]").forEach((button) => {
        button.addEventListener("click", () => showView(button.dataset.go));
      });
    </script>
  </body>
</html>
